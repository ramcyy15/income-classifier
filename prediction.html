<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-pink-200 to-pink-300">

  <div class="bg-pink-100/60 backdrop-blur-lg shadow-lg rounded-xl p-10 w-full max-w-5xl">

   
    <div class="text-center mb-10">
      <h1 class="text-pink-500 text-xl font-semibold">
        Classification of Barangay Income Levels
      </h1>
      <p class="text-blue-400 text-sm">
        District V, Quezon City
      </p>
    </div>

    
    <div class="grid md:grid-cols-2 gap-8">

    
      <div class="bg-gray-100 rounded-xl p-8 text-center">
        <h2 class="text-green-600 text-2xl font-bold mb-4">
          Middle Income
        </h2>

        <p class="text-sm text-gray-600">
          Prediction Result
        </p>

        <p class="text-sm text-gray-500 mt-3">
          Confidence: 85%
        </p>
      </div>

      <div class="bg-gray-100 rounded-xl overflow-hidden">
        <img 
          src="district 5.png"
          class="w-full h-full object-cover"
        />
      </div>

    </div>

   
    <div class="mt-10 border-t pt-6">
      <div class="w-64 h-3 bg-gray-300 rounded"></div>
    </div>

  </div>

</body>
</html>
